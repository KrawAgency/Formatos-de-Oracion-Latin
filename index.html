<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oraciones</title>
<style>
  :root { --fondo:#faf6ef; --texto:#2b2118; --boton:#6b3e26; --botonTexto:#fff; --borde:#e2d6c3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto);
         font-family: Georgia, "Times New Roman", serif; font-size:22px; line-height:1.4; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:34px; text-align:center; margin:0 0 6px; }
  .ayuda { text-align:center; font-size:20px; margin:0 0 28px; }
  a.oracion { display:block; text-decoration:none; color:var(--botonTexto);
         background:var(--boton); border-radius:16px; padding:24px 20px; margin:0 0 18px;
         font-size:24px; font-weight:bold; text-align:center; }
  a.oracion:active { opacity:.8; }
  a.oracion small { display:block; font-weight:normal; font-size:18px; margin-top:6px; opacity:.9; }
</style>
</head>
<body>
<main>
  <h1>✝ Oraciones</h1>
  <p class="ayuda">Toque la oración que quiere abrir.</p>

  <a class="oracion" href="pdf/Santo-Rosario.pdf">Santo Rosario<small>Tarda un poquito en abrir</small></a>
  <a class="oracion" href="pdf/100-Requiem-Aeternam.pdf">100 Réquiem Aeternam</a>
  <a class="oracion" href="pdf/3-Ave-Marias-pro-Animis-Purgatorii.pdf">3 Ave Marías por las Ánimas del Purgatorio</a>
  <a class="oracion" href="pdf/3-Ave-Marias-Llama-de-Amor.pdf">3 Ave Marías de la Llama de Amor</a>
  <a class="oracion" href="pdf/Oracion-a-San-Padre-Pio.pdf">Oración a San Padre Pío</a>
</main>
</body>
</html>
